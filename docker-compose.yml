version: "3.9"

# =============================================================================
# TradeTracker — Local Development Stack
#
# Prerequisites: Docker Desktop with at least 6 GB RAM allocated.
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up             # start everything
#   docker compose up -d backend  # start just the Spring Boot app
#
# Ports at a glance:
#   3000  Frontend (React / Vite)
#   8080  Backend (Spring Boot)
#   8081  Keycloak admin console
#   8082  Redpanda Console
#   8083  RabbitMQ management UI
#   8025  MailHog web UI
#   9001  MinIO console
#   9090  Prometheus
#   3001  Grafana
#   3100  Loki
# =============================================================================

networks:
  tradetracker:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  redpanda_data:
  rabbitmq_data:
  keycloak_data:
  grafana_data:
  loki_data:
  tempo_data:

services:

  # ===========================================================================
  # Auth — Keycloak 24
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:-tradetracker}
      KC_DB_PASSWORD: ${DB_PASSWORD:-tradetracker}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradetracker
    restart: unless-stopped

  # ===========================================================================
  # Database — PostgreSQL 16 + TimescaleDB
  # ===========================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-tradetracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tradetracker}
      POSTGRES_DB: tradetracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - tradetracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tradetracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Cache — Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tradetracker}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - tradetracker
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-tradetracker}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Object Storage — MinIO (S3-compatible)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-tradetracker}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-tradetracker}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - tradetracker
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - tradetracker
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-tradetracker} ${AWS_SECRET_ACCESS_KEY:-tradetracker};
        mc mb --ignore-existing local/trade-confirmations;
        mc mb --ignore-existing local/reports;
        mc mb --ignore-existing local/market-data-raw;
        echo 'Buckets ready';
      "

  # ===========================================================================
  # Message Bus — Redpanda (Kafka-compatible)
  # ===========================================================================
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "19092:19092"
      - "18081:18081"
    networks:
      - tradetracker
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.+true'"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    volumes:
      - ./infra/redpanda/console-config.yaml:/etc/redpanda/redpanda-console-config.yaml:ro
    environment:
      CONFIG_FILEPATH: /etc/redpanda/redpanda-console-config.yaml
    ports:
      - "8082:8080"
    depends_on:
      - redpanda
    networks:
      - tradetracker
    restart: unless-stopped

  # ===========================================================================
  # Task Queue — RabbitMQ 3 (Spring AMQP)
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tradetracker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tradetracker}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "8083:15672"    # Management UI
    networks:
      - tradetracker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Backend — Spring Boot (modular monolith)
  # Mounts source for hot-reload via spring-boot:run in dev mode
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tradetracker
      DB_USER: ${DB_USER:-tradetracker}
      DB_PASSWORD: ${DB_PASSWORD:-tradetracker}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-tradetracker}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-tradetracker}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-tradetracker}
      # Keycloak
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/tradetracker
      # MinIO / S3
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-tradetracker}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-tradetracker}
      # Mail
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      # Tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      # Market data
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
      OPEN_EXCHANGE_RATES_APP_ID: ${OPEN_EXCHANGE_RATES_APP_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - tradetracker
    restart: unless-stopped

  # ===========================================================================
  # Frontend — React + Vite (dev mode with hot reload)
  # ===========================================================================
  frontend:
    image: tradetracker-frontend:dev
    container_name: frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: tradetracker
      VITE_KEYCLOAK_CLIENT_ID: tradetracker-frontend
    ports:
      - "3002:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - /app/node_modules
    networks:
      - tradetracker
    restart: unless-stopped

  # ===========================================================================
  # Dev Email — MailHog
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tradetracker
    restart: unless-stopped

  # ===========================================================================
  # Observability
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - tradetracker
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - tradetracker
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - tradetracker
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo query UI
      - "4318:4318"   # OTLP HTTP receiver (Spring Boot exports here)
    networks:
      - tradetracker
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./infra/loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - tradetracker
    restart: unless-stopped
