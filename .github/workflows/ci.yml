name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: tradetracker
          POSTGRES_PASSWORD: tradetracker
          POSTGRES_DB: tradetracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradetracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tradetracker_test
          SPRING_DATASOURCE_USERNAME: tradetracker
          SPRING_DATASOURCE_PASSWORD: tradetracker
          SPRING_PROFILES_ACTIVE: test
        run: mvn verify -B --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-report
          path: '**/target/surefire-reports/*.xml'

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
          VITE_KEYCLOAK_URL: http://localhost:8081
          VITE_KEYCLOAK_REALM: tradetracker
          VITE_KEYCLOAK_CLIENT_ID: tradetracker-frontend

  # ── Unit tests (fast, no DB) ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Java)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests only (no Docker required)
        run: |
          mvn test \
            -pl tradetracker-calculation,tradetracker-tax,tradetracker-document,tradetracker-portfolio,tradetracker-broker \
            -B --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: '**/target/surefire-reports/*.xml'

  # ── E2E tests ────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: tradetracker
          POSTGRES_PASSWORD: tradetracker
          POSTGRES_DB: tradetracker
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tradetracker" --health-interval 10s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

      keycloak:
        image: quay.io/keycloak/keycloak:24.0
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_DB: dev-mem
          KC_HTTP_ENABLED: "true"
          KC_HOSTNAME: localhost
        ports: ["8081:8080"]
        options: --health-cmd "curl -f http://localhost:8080/health/ready" --health-interval 15s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend JAR
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Start backend
        run: |
          java -jar tradetracker-app/target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/tradetracker \
            --spring.datasource.username=tradetracker \
            --spring.datasource.password=tradetracker \
            --spring.data.redis.host=localhost \
            --spring.data.redis.password= \
            --spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/tradetracker &
          sleep 20

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Seed E2E test user in Keycloak
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8081/realms/master/protocol/openid-connect/token \
            -d "grant_type=password&client_id=admin-cli&username=admin&password=admin" \
            | jq -r .access_token)
          curl -s -X POST http://localhost:8081/admin/realms/tradetracker/users \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"username":"e2e@tradetracker.test","email":"e2e@tradetracker.test","enabled":true,"credentials":[{"type":"password","value":"E2eTest!2024","temporary":false}]}'

      - name: Run E2E tests
        working-directory: frontend
        env:
          KEYCLOAK_URL:    http://localhost:8081
          TEST_USER_EMAIL: e2e@tradetracker.test
          TEST_USER_PASS:  E2eTest!2024
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: tradetracker-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: builder
          push: false
          tags: tradetracker-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
